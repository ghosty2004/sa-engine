[package]
name = "sa-samp-api"
version = "0.1.0"
description = "The game-adapter traits the SA:MP client (samp-rs) calls instead of gta_sa.exe addresses. Types and traits only (the value types are sa-types), no implementation; builds for host, i686-pc-windows-gnu and wasm32"
edition.workspace = true
license.workspace = true

# Only the dependency-free value types: samp-rs (an i686 Windows cdylib) uses this crate without pulling in any
# engine crate.
[dependencies]
sa-types = { path = "../../../crates/sa-types" }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
