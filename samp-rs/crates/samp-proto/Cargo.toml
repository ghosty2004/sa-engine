[package]
name = "samp-proto"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Clean-room SA:MP 0.3.7 wire protocol (version-independent core)"

[features]
# The browser's clock on wasm32 (`time`); without it a wasm32 build runs on the clock its host installs.
web = ["dep:web-time"]

[dependencies]
web-time = { version = "1.1", optional = true }
