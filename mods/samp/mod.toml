# SA:MP's mod manifest (docs/arch/ADR-004-mods.md section 3.3). mods/build.sh puts it next to samp.wasm.
[mod]
id = "samp"
name = "SA:MP"
version = "0.2.0"
api_version = "1.11"
entry = "samp.wasm"

[permissions]
render = true
state = "write"             # the local player, the camera, the HUD, the clock and weather the server sets
input = "capture"           # the connect screen, chat typing and dialogs take the keyboard
entities = true             # the server's vehicles, objects and models, and the other players
scripts = true              # tasks, animations, camera and world commands
audio = true                # the sounds the server plays
net = ["udp:user-approved"]  # the servers the user approves (the host asks once per server)
files = "own"               # SA:MP's UI files the user copies in: sampgui.png, mouse.png, gtaweap3.ttf, sampaux3.ttf
storage = true              # server, name, favourites, recent, auth_table.txt, auto_connect, auto_spawn; the serial seed
http = ["https://api.open.mp/"]  # the Internet tab's server list

[limits]
memory_mib = 64
fuel = 200000000
