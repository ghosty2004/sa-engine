[package]
name = "sa-net"
version = "0.1.0"
description = "Datagram transports for the SA:MP client and the mods' sockets: native UDP, and WebSocket through sa-udp-proxy for the browser build (docs/samp/web-proxy.md)"
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Native WebSocket transport (blocking tungstenite, non-blocking after the handshake): for host tests of the
# proxy path and for native tools that must go through the proxy.
native-ws = ["dep:tungstenite"]
# The browser's WebSocket transport (wasm32 builds that run on a web page; a wasm32 module without it, such as a mod,
# imports nothing from JavaScript).
websocket = ["dep:wasm-bindgen", "dep:js-sys", "dep:web-sys"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tungstenite = { version = "0.29", default-features = false, features = ["handshake"], optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { version = "0.2.130", optional = true }
js-sys = { version = "0.3.107", optional = true }
web-sys = { version = "0.3.107", features = ["WebSocket", "BinaryType", "MessageEvent", "CloseEvent", "Event"], optional = true }

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"
