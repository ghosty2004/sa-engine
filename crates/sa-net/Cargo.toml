[package]
name = "sa-net"
version = "0.1.0"
description = "Datagram transports for the SA:MP client: native UDP, and WebSocket through sa-udp-proxy for the browser build (docs/samp/web-proxy.md)"
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Native WebSocket transport (blocking tungstenite, non-blocking after the handshake): for host tests of the
# proxy path and for native tools that must go through the proxy.
native-ws = ["dep:tungstenite"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tungstenite = { version = "0.29", default-features = false, features = ["handshake"], optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.130"
js-sys = "0.3.107"
web-sys = { version = "0.3.107", features = ["WebSocket", "BinaryType", "MessageEvent", "CloseEvent", "Event"] }

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"
