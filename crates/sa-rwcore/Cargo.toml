[package]
name = "sa-rwcore"
version = "0.1.0"
description = "Phase A port of the RenderWare 3.6 core linked into gta_sa.exe 1.0 US (PORT-RW-1): math, freelists, frames, plugin registry, streams, atomics/clumps/geometry/materials/textures, camera, Im3D, in the original memory layout. Built on sa-core (ADR-001). no_std; host, i686-pc-windows-gnu and wasm32"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
sa-core = { path = "../sa-core" }
sa-math = { path = "../sa-math" }
sa-macros = { path = "../sa-macros" }

[dev-dependencies]
sa-stream = { path = "../sa-stream" }
sa-world = { path = "../sa-world" }
sa-pop = { path = "../sa-pop" }
sa-script = { path = "../sa-script" }
sa-weapon = { path = "../sa-weapon" }
sa-ped = { path = "../sa-ped" }
sa-input = { path = "../sa-input" }
sa-anim = { path = "../sa-anim" }
sa-veh = { path = "../sa-veh" }
sa-hud = { path = "../sa-hud" }

[features]
# Phase A: run inside gta_sa.exe 1.0 US (sa-hook); see sa-world.
in-process = ["sa-core/in-process"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(sa_phase_a)"] }
