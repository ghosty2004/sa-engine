[package]
name = "sa-mod"
version = "0.1.0"
description = "The Rust SDK for sa-engine mods: safe bindings over the sa-mod-api interface and the `entry!` macro that exports a mod's entry points. Build mods with --target wasm32-unknown-unknown"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
sa-mod-api = { path = "../sa-mod-api" }

[lints.rust]
missing_docs = "warn"
