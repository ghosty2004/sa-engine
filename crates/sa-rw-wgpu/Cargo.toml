[package]
name = "sa-rw-wgpu"
version = "0.1.0"
description = "RenderWare device layer on wgpu (phases B/C): GPU geometry/texture instancing of sa-rw objects and the world pass (prelit day/night blend, alpha test/blend, fog, sky), and the D3D9 device seam (`d3d9::WgpuDevice`, fixed-function emulation). Native (Vulkan/Metal/DX12) and wasm32 (WebGPU)"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
sa-rw = { path = "../sa-rw" }
sa-platform = { path = "../sa-platform", default-features = false }
wgpu = "29"
bytemuck = { version = "1", features = ["derive"] }

[dev-dependencies]
png = "0.18"

[lints.rust]
unsafe_code = "forbid"
