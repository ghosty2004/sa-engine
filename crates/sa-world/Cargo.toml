[package]
name = "sa-world"
version = "0.1.0"
description = "WORLD subsystems of gta_sa.exe 1.0 US; so far collision (PORT-COLL): CCollision, CCollisionData, CColModel, CColTrianglePlane, SurfaceInfos_c, CColAccel, CTempColModels. Built on sa-core (ADR-001). no_std; host, i686-pc-windows-gnu and wasm32"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
sa-core = { path = "../sa-core" }
sa-math = { path = "../sa-math" }
sa-macros = { path = "../sa-macros" }
# CFileLoader::LoadLine and the sscanf helper (phase B paths of the loaders' calls)
sa-stream = { path = "../sa-stream" }

[features]
# Phase A: run inside gta_sa.exe 1.0 US (sa-hook). Forwards to sa-core (whose `globals!`/`orig!`
# expansions pick the memory model); build.rs sets `cfg(sa_phase_a)` for this crate's own tests.
in-process = ["sa-core/in-process", "sa-stream/in-process"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(sa_phase_a)"] }
