[package]
name = "sa-render"
version = "0.1.0"
description = "RENDER subsystem of gta_sa.exe 1.0 US (PORT-RENDER), game side: CRenderer visibility and sector scanning, cull zones, sprites, shadows, coronas, point lights, clouds, weather render side, post effects, bullet traces, special FX and the FX system. Built on sa-core (ADR-001). no_std; host, i686-pc-windows-gnu and wasm32"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
sa-core = { path = "../sa-core" }
sa-math = { path = "../sa-math" }
sa-macros = { path = "../sa-macros" }
sa-stream = { path = "../sa-stream" }
sa-world = { path = "../sa-world" }
sa-pop = { path = "../sa-pop" }

[features]
# Phase A: run inside gta_sa.exe 1.0 US (sa-hook); see sa-world.
in-process = ["sa-core/in-process", "sa-stream/in-process", "sa-world/in-process", "sa-pop/in-process"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(sa_phase_a)"] }
