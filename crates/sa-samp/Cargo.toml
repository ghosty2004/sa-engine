[package]
name = "sa-samp"
version = "0.1.0"
description = "The native sa-engine backend of the SA:MP game adapter (docs/samp/game-adapter.md, docs/samp/native-plan.md): implements the sa-samp-api traits on the ported engine's state, so samp-rs can run inside native sa-game"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
sa-stream = { path = "../sa-stream" }
sa-render = { path = "../sa-render" }
sa-hud = { path = "../sa-hud" }
sa-rwcore = { path = "../sa-rwcore" }
sa-core = { path = "../sa-core" }
sa-access = { path = "../sa-access" }
sa-samp-api = { path = "../sa-samp-api" }
# samp-rs's renderer-independent UI logic (the engine backend uses its geometry, colour codes and font sizes).
samp-ui = { path = "../../samp-rs/crates/samp-ui" }
# Rasterises the UI fonts into the glyph atlas (the committed Liberation Sans Bold, the user's Arial Bold,
# gtaweap3.ttf, sampaux3.ttf): pure Rust, builds for i686 and wasm32.
ab_glyph = "0.2"

[features]
# `fake`: a fake engine memory for other crates' host tests
fake = ["sa-access/fake"]

[lints.rust]
missing_docs = "warn"
