[package]
name = "sa-mod-api"
version = "0.1.0"
description = "The mod API's interface definition: the one source of truth of the core-wasm ABI between the mod host and the mod SDK (imports, exports, value types, status codes, versions, game-state records, events, hook values). No unsafe; builds for host, i686 and wasm32"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# the game adapter's types: the state records and hook values are expressed in them
sa-samp-api = { path = "../sa-samp-api" }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
