[package]
name = "sa-samp-api"
version = "0.1.0"
description = "SAMP-API: the game-adapter traits the SA:MP client (samp-rs) calls instead of gta_sa.exe addresses. Types and traits only, no dependencies, no implementation; builds for host, i686-pc-windows-gnu and wasm32"
edition.workspace = true
license.workspace = true
publish.workspace = true

# No dependencies on purpose: samp-rs (an i686 Windows cdylib in its own repository) must be able to use
# this crate without pulling in any sa-engine crate.
[dependencies]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
