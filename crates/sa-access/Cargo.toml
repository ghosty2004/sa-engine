[package]
name = "sa-access"
version = "0.1.0"
description = "The running game's state, read and written from outside the ports through handles: pool lookups, ped / vehicle / camera / world records, keys, and changes through the game's own script command handlers (entities, positions, health, money, wanted level, clock, weather, sounds). Used by the mod host and the SA:MP game adapter"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
sa-core = { path = "../sa-core" }
sa-types = { path = "../sa-types" }

[features]
# `fake`: a fake engine memory for other crates' host tests
fake = []

[lints.rust]
missing_docs = "warn"
