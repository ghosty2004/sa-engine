[package]
name = "sa-hook"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Phase A DLL injected into gta_sa.exe 1.0 US: hook table, live Rust/original toggles, control channel, determinism mode, input recorder/replayer, frame-state hasher"

[lib]
name = "sa_hook"
crate-type = ["cdylib", "rlib"]

[dependencies]
sa-oracle-format = { path = "../sa-oracle-format" }
sa-math = { path = "../sa-math" }
# Engine ports (their `#[hook]` registrations become hook-table entries); phase A memory model.
sa-core = { path = "../sa-core", features = ["in-process"] }
sa-stream = { path = "../sa-stream", features = ["in-process"] }
sa-world = { path = "../sa-world", features = ["in-process"] }
sa-pop = { path = "../sa-pop", features = ["in-process"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_Kernel",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Performance",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_UI_WindowsAndMessaging",
] }

# Differential tests only: our length decoder is checked against iced-x86 on the real exe.
[dev-dependencies]
iced-x86 = { version = "1.21", default-features = false, features = ["std", "decoder", "instr_info"] }
