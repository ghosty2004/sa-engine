[package]
name = "sa-hook"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Phase A DLL injected into gta_sa.exe 1.0 US: hook table, live Rust/original toggles, control channel"

[lib]
name = "sa_hook"
crate-type = ["cdylib", "rlib"]

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
] }

# Differential tests only: our length decoder is checked against iced-x86 on the real exe.
[dev-dependencies]
iced-x86 = { version = "1.21", default-features = false, features = ["std", "decoder", "instr_info"] }
