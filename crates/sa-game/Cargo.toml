[package]
name = "sa-game"
version = "0.1.0"
description = "Phase B entry point (PLAN §2, F10): initialises sa-platform natively (no Wine, no gta_sa.exe), binds the ported code's Win32/CRT/DirectInput declarations to it, and runs the ported boot and frame entry points, reporting every function on the path that is still original-only"
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["native", "gamepad"]
gamepad = ["native", "sa-platform/gamepad"]
native = ["sa-platform/native"]
audio = ["sa-platform/audio"]
# WebAssembly mods (MOD-2, docs/arch/ADR-004-mods.md): `--mods DIR` natively, `?mods=a,b` on the web page. Off by
# default: without it no mod code is compiled in (the parity build).
mods = ["dep:sa-mod-host", "dep:sa-mod-api", "dep:sa-access", "dep:sa-types", "sa-rw-wgpu/overlay", "sa-core/observe"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
sa-core = { path = "../sa-core" }
sa-image = { path = "../sa-image" }
sa-input = { path = "../sa-input" }
sa-stream = { path = "../sa-stream" }
sa-ports = { path = "../sa-ports" }
sa-render = { path = "../sa-render" }
sa-rwcore = { path = "../sa-rwcore" }
sa-audio = { path = "../sa-audio" }
sa-ai = { path = "../sa-ai" }
sa-cam = { path = "../sa-cam" }
sa-hud = { path = "../sa-hud" }
sa-veh = { path = "../sa-veh" }
sa-anim = { path = "../sa-anim" }
sa-ped = { path = "../sa-ped" }
sa-weapon = { path = "../sa-weapon" }
sa-script = { path = "../sa-script" }
sa-pop = { path = "../sa-pop" }
sa-world = { path = "../sa-world" }
sa-platform = { path = "../sa-platform", default-features = false }
sa-rw-wgpu = { path = "../sa-rw-wgpu" }
sa-mod-host = { path = "../sa-mod-host", optional = true }
sa-access = { path = "../sa-access", optional = true }
sa-types = { path = "../sa-types", optional = true }
sa-mod-api = { path = "../sa-mod-api", optional = true }
wgpu = "29"
png = "0.18"
web-time = "1.1"
# the D3D9 resource objects' map, looked up on every SetTexture / SetStreamSource / SetIndices
rustc-hash = "2"
# pure-Rust Vorbis decoder behind the VORBISFILE.DLL replacement (vorbisfile.rs); MIT OR Apache-2.0
lewton = "0.10"

[dev-dependencies]
sa-testkit = { path = "../sa-testkit" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
libc = "0.2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { version = "29", features = ["fragile-send-sync-non-atomic-wasm", "webgpu", "webgl"] }
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["console", "DedicatedWorkerGlobalScope", "WorkerGlobalScope", "Performance", "FileReaderSync", "Blob", "File", "XmlHttpRequest", "XmlHttpRequestResponseType", "OffscreenCanvas", "MessageEvent"] }
