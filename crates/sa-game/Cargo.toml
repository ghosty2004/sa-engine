[package]
name = "sa-game"
version = "0.1.0"
description = "Phase B entry point (PLAN §2, F10): initialises sa-platform natively (no Wine, no gta_sa.exe), binds the ported code's Win32/CRT/DirectInput declarations to it, and runs the ported boot and frame entry points, reporting every function on the path that is still original-only"
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["native", "gamepad"]
gamepad = ["native", "sa-platform/gamepad"]
native = ["sa-platform/native"]
audio = ["sa-platform/audio"]
# `--samp` joins SA:MP / open.mp servers with samp-rs's network core (docs/samp/native-plan.md).
samp = ["dep:samp-client", "dep:samp-proto", "dep:samp-saa"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
sa-core = { path = "../sa-core" }
sa-input = { path = "../sa-input" }
sa-stream = { path = "../sa-stream" }
sa-ports = { path = "../sa-ports" }
sa-render = { path = "../sa-render" }
sa-rwcore = { path = "../sa-rwcore" }
sa-audio = { path = "../sa-audio" }
sa-ai = { path = "../sa-ai" }
sa-cam = { path = "../sa-cam" }
sa-hud = { path = "../sa-hud" }
sa-veh = { path = "../sa-veh" }
sa-anim = { path = "../sa-anim" }
sa-ped = { path = "../sa-ped" }
sa-weapon = { path = "../sa-weapon" }
sa-script = { path = "../sa-script" }
sa-pop = { path = "../sa-pop" }
sa-world = { path = "../sa-world" }
sa-platform = { path = "../sa-platform", default-features = false }
sa-rw-wgpu = { path = "../sa-rw-wgpu" }
sa-samp = { path = "../sa-samp" }
sa-samp-api = { path = "../sa-samp-api" }
sa-samp-ui = { path = "../sa-samp-ui" }
wgpu = "29"
png = "0.18"
web-time = "1.1"
# samp-rs (branch sa-engine/adapter), pinned to a commit. samp-client takes sa-samp-api from this repository;
# the workspace `[patch]` points that back at `crates/sa-samp-api`, so both sides share one crate.
samp-client = { git = "file:///home/ghosty2004/sa-engine/.claude/worktrees/agent-af11bd66b65e2aabf/target/samp-rs-adapter", rev = "fb890107bdd1acb2edbdafac39ad6d45130629f3", optional = true }
samp-proto = { git = "file:///home/ghosty2004/sa-engine/.claude/worktrees/agent-af11bd66b65e2aabf/target/samp-rs-adapter", rev = "fb890107bdd1acb2edbdafac39ad6d45130629f3", optional = true }
samp-saa = { git = "file:///home/ghosty2004/sa-engine/.claude/worktrees/agent-af11bd66b65e2aabf/target/samp-rs-adapter", rev = "fb890107bdd1acb2edbdafac39ad6d45130629f3", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
libc = "0.2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { version = "29", features = ["fragile-send-sync-non-atomic-wasm", "webgpu", "webgl"] }
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["console", "DedicatedWorkerGlobalScope", "WorkerGlobalScope", "Performance", "FileReaderSync", "Blob", "File", "XmlHttpRequest", "XmlHttpRequestResponseType", "OffscreenCanvas", "MessageEvent"] }
