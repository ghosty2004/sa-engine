[package]
name = "sa-platform"
version = "0.1.0"
description = "Platform layer (PLAN §2): file system and Windows namespace, clock and Win32 time, input (Win32 messages, DirectInput records), audio sink, the D3D9 device seam, window/event loop, worker spawn. Traits are target-independent; the `native` module (winit + std fs, gilrs, cpal) is the first implementation, a web one follows in phase C"
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["native"]
# winit window + input and std::fs (ignored on wasm32)
native = ["dep:winit"]
# game pads through gilrs (native only)
gamepad = ["native", "dep:gilrs"]
# audio output through cpal (native only; needs ALSA on Linux)
audio = ["native", "dep:cpal"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
winit = { version = "0.30", optional = true }
gilrs = { version = "0.11", optional = true }
cpal = { version = "0.17", optional = true }

[lints.rust]
unsafe_code = "forbid"
